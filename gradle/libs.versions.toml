[versions]
pluginYmlPaperVersion = "0.9.0"
paperApiVersion = "26.1.2.build.+"
minedownAdventure = "1.7.6-SNAPSHOT"
cloud = "1.8.4"
hikari = "6.3.3"

[libraries]
paperApi = { group = "io.papermc.paper", name = "paper-api", version.ref = "paperApiVersion" }
minedownAdventure = { group = "de.themoep", name = "minedown-adventure", version.ref = "minedownAdventure" }
cloudPaper = { group = "cloud.commandframework", name = "cloud-paper", version.ref = "cloud" }
cloudAnnotations = { group = "cloud.commandframework", name = "cloud-minecraft-extras", version.ref = "cloud" }
cloudMinecraftExtras = { group = "cloud.commandframework", name = "cloud-annotations", version.ref = "cloud" }
hikari = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }

[plugins]
pluginYmlPaper = { id = "de.eldoria.plugin-yml.paper", version.ref = "pluginYmlPaperVersion" }